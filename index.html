<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="קטלוג מוצרי דגל המשיח של מרכז חב״ד משיח">
<title>מרכז חב״ד משיח — קטלוג</title>
<link rel="stylesheet" href="catalogue-editorial.css?v=model-cards">
<link rel="stylesheet" href="/appearance.css?v=3">
<script type="module" src="catalogue-editorial.js?v=appearance-5"></script>
<link rel="stylesheet" href="/appearance-fonts.css?v=2"></head>
<body>
<header class="mast"><a href="/" class="brand" data-appearance-type="brand">מרכז חב״ד משיח</a><nav aria-label="ניווט ראשי"><a class="account-link" href="/account/" data-appearance-text="menuAccount" data-appearance-link="account">החשבון שלי</a><a href="#catalog" data-appearance-text="menuCatalog" data-appearance-link="catalog">לקטלוג ↓</a><button id="basket" type="button" aria-label="פתיחת סל הקניות"><span aria-hidden="true">🛒</span> <span data-appearance-text="basketButton">סל קניות</span> <b id="count">0</b></button></nav></header>
<main>
<section class="cover" aria-labelledby="cover-title">
<div class="cover-copy"><p data-appearance-type="eyebrow" data-appearance-text="eyebrow">מרכז חב״ד משיח</p><h1 id="cover-title" data-appearance-text="title" data-appearance-type="title">מוצרי דגל<br>המשיח<span>.</span></h1><p data-appearance-text="subtitle" data-appearance-type="subtitle">מפרסם את הגאולה בעזרת מוצרי דגל המשיח.</p><a class="ink-link" href="#catalog"><span data-appearance-text="catalogButton">גלו את הקטלוג</span> <span aria-hidden="true">↓</span></a><a class="ink-link" href="/?collection=heroes#catalog"><span data-appearance-text="modelsButton">דגמי דגליה ודגלית</span> <span aria-hidden="true">↓</span></a></div>
<button class="exhibit" id="feature" type="button" aria-label="פרטי סיכת משיח בית המקדש"><img src="assets-v8/temple-home.webp" alt="סיכת משיח בית המקדש"><span>סיכת משיח בית המקדש</span></button>
</section>
<section class="catalog" id="catalog" aria-labelledby="catalog-title">
<aside class="index"><h2>קטגוריות</h2><nav id="categories" aria-label="קטגוריות מוצרים"></nav><noscript><p role="alert">יש להפעיל JavaScript בדפדפן כדי לראות את הקטגוריות והמוצרים. אפשר לפנות לחנות בטלפון 053-377-0073.</p></noscript></aside>
<div class="stock"><div class="heading"><h2 id="catalog-title">כל המוצרים</h2><p id="result-count" role="status">טוען קטלוג…</p></div>
<div class="controls"><label>חיפוש מוצרים<input id="search" type="search" placeholder="שם מוצר או מק״ט"></label><label>מיון<select id="sort"><option value="catalog">סדר הקטלוג</option><option value="low">מחיר מהנמוך לגבוה</option><option value="high">מחיר מהגבוה לנמוך</option></select></label><button id="reset" type="button">איפוס</button></div><div id="badge-filters" class="badge-filters" hidden aria-label="סינון מדבקות"></div>
<div id="products" class="products"></div>
<noscript><p>קטלוג מוצרי משיח: מדבקות לפלאפון, דגלים, סיכות, כיפות, מחזיקי מפתחות ומוצרים נוספים. לעיון במלאי ובמחירים יש להפעיל JavaScript.</p></noscript></div>
</section>
</main>
<footer><strong>מרכז חב״ד משיח</strong><a href="tel:+972533770073" dir="ltr">053-377-0073</a><a href="/privacy/">מדיניות פרטיות</a></footer>
<button id="floating-cart" class="floating-cart" type="button" hidden aria-label="פתיחת סל הקניות">
  <span class="floating-cart-icon" aria-hidden="true">🛒</span>
  <span class="floating-cart-description"><strong>הסל שלי <span id="floating-cart-count">0</span> פריטים</strong><small>לצפייה בסל ולעדכון כמויות</small></span>
  <strong id="floating-cart-total" class="floating-cart-total" dir="ltr">₪0</strong>
  <span class="floating-cart-arrow" aria-hidden="true">←</span>
</button>
<dialog id="cart-dialog" class="cart-drawer" aria-labelledby="cart-dialog-title">
  <div class="cart-drawer-header"><div><span class="cart-overline">ההזמנה שלך</span><h2 id="cart-dialog-title">סל הקניות <span id="drawer-count"></span></h2></div><button id="close-cart" type="button" class="cart-close" aria-label="סגירת סל הקניות">×</button></div>
  <div id="cart-dialog-body" class="cart-drawer-content"></div>
</dialog>
<dialog id="dialog"><div class="dialog-top"><button id="close" type="button" aria-label="סגירה">×</button></div><div id="dialog-body"></div></dialog>
<p class="sr-only" id="announcement" role="status"></p>
</body>
</html>
