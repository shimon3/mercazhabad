<!doctype html>

<head>

<link rel="stylesheet" href="catalogue-editorial.css">

</head>
<body>
<header class="mast"><a href="#" class="brand">מרכז חב״ד משיח</a><nav aria-label="ניווט ראשי"><a class="account-link" href="/account/">החשבון שלי</a><a href="#catalog">לקטלוג ↓</a><button id="basket" type="button">סל קניות <b id="count">0</b></button></nav></header>
<main>
<section class="cover" aria-labelledby="cover-title">
<div class="cover-copy"><p>מרכז חב״ד משיח</p><h1 id="cover-title">מוצרי דגל<br>המשיח<span>.</span></h1><p>מפרסם את הגאולה בעזרת מוצרי דגל המשיח.</p><a class="ink-link" href="#catalog">גלו את הקטלוג <span aria-hidden="true">↓</span></a></div>
<button class="exhibit" id="feature" type="button" aria-label="פרטי סיכת משיח בית המקדש"><img src="assets-v8/s_3-temple.webp" alt="סיכת משיח בית המקדש"><span>סיכת משיח בית המקדש <bdi>s/3-temple</bdi></span></button>
</section>
<section class="catalog" id="catalog" aria-labelledby="catalog-title">

<div class="stock"><div class="heading"><h2 id="catalog-title">כל המוצרים</h2><p id="result-count" role="status">טוען קטלוג…</p></div>

<div id="products" class="products"></div></div>
</section>
</main>
<footer><strong>מרכז חב״ד משיח</strong><a href="https://mercaz-habad.pages.dev/">לאתר החנות ↗</a></footer>
<dialog id="dialog"><div class="dialog-top"><button id="close" type="button" aria-label="סגירה">×</button></div><div id="dialog-body"></div></dialog>
