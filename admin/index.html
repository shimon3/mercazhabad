<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול חנות | מרכז חב״ד משיח</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f7f5ef;font-family:Rubik,Arial,sans-serif;color:#201b17}
header{background:#151515;color:#f7e7c7;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:inherit}header small{color:#cda760}
main{width:min(1200px,94%);margin:26px auto}.notice{border:1px solid #e4d9c3;background:#fffaee;border-radius:13px;padding:12px;margin-bottom:17px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #ddd4c8}input,textarea,select{background:white}button{cursor:pointer;background:#191919;color:#f6dcab;border:0}button:disabled{opacity:.45;cursor:not-allowed}
#search{flex:1;min-width:170px}.table-wrap{overflow-x:auto;background:white;border:1px solid #e4ddcf;border-radius:13px}table{width:100%;border-collapse:collapse;min-width:720px}td,th{text-align:right;padding:12px;border-bottom:1px solid #f0e9df}th{background:#f7f2e8}.thumb{width:54px;height:54px;object-fit:contain;background:#faf8f3}.secondary{color:#80715e;font-size:13px}.pill{background:#f8edcc;padding:5px 9px;border-radius:9px;font-size:12px}dialog{border:0;border-radius:18px;box-shadow:0 18px 75px #0005;width:min(560px,94vw);max-height:90vh}dialog::backdrop{background:#12121299}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form label{display:flex;flex-direction:column;gap:6px;font-size:13px}.form label.wide{grid-column:1/-1}.form input,.form textarea{width:100%}.form textarea{min-height:85px}.controls{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.ghost{background:#eee8db;color:#211c16}
#message{min-height:24px;white-space:pre-wrap}.error{color:#a32b2b}.ok{color:#236b35}input[type=checkbox]{width:auto}
@media(max-width:600px){header{padding:14px}header h2{font-size:17px}.form{grid-template-columns:1fr}.form label.wide{grid-column:auto}dialog{padding:16px}.toolbar button{width:100%}}
</style></head><body>
<header><div><h2>ניהול חנות · מרכז חב״ד משיח</h2><small>גישה למנהל מורשה בלבד · Cloudflare Access</small></div><a href="/">↩ חזרה לחנות</a></header>
<main><div class="notice">הניהול מוגן. מחירים לא מאושרים נשארים ריקים; מלאי התחלתי הוא 0 עד לאישור בעל החנות. כל שינוי נשמר ביומן ביקורת.</div>
<div class="toolbar"><input id="search" placeholder="חיפוש שם, מק״ט או קטגוריה" aria-label="חיפוש מוצרים"><button id="reload">רענון נתונים</button><span id="count" class="pill"></span></div>
<p id="message" role="status"></p><div class="table-wrap"><table><thead><tr><th>תמונה</th><th>מוצר</th><th>מק״ט</th><th>מחיר ₪</th><th>מלאי</th><th>מצב</th><th>פעולה</th></tr></thead><tbody id="products"><tr><td colspan="7">טוען…</td></tr></tbody></table></div>
<dialog id="editor"><form id="productForm"><h2>עריכת מוצר</h2><p id="sku" class="secondary"></p><div class="form">
<label class="wide">שם המוצר בעברית<input name="name_he" maxlength="200" required></label>
<label class="wide">תיאור בעברית / פרטי המוצר<textarea name="description" maxlength="3000"></textarea></label>
<label>מחיר ₪ (ריק = לא ידוע)<input name="price" type="number" min="0" max="1000000" step="0.01"></label>
<label>מחיר קודם ₪<input name="old_price" type="number" min="0" max="1000000" step="0.01"></label>
<label>מלאי מאומת<input name="stock" type="number" min="0" max="1000000" step="1" required></label>
<label>מופיע בקטלוג<select name="active"><option value="1">כן</option><option value="0">לא</option></select></label>
<label class="wide">תמונה חדשה (PNG / JPG / WebP, עד 5 MB)<input id="newPhoto" type="file" accept="image/png,image/jpeg,image/webp"></label>
</div><div class="controls"><button class="ghost" type="button" id="cancel">ביטול</button><button type="submit" id="save">שמירת שינויים</button></div></form></dialog>
</main><script>
let products=[],editing=null;const $=id=>document.getElementById(id),msg=(s,ok=false)=>{$('message').textContent=s;$('message').className=ok?'ok':'error'};
const money=n=>n==null?'לא אושר':(n/100).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2});
const imageUrl=path=>path.startsWith('assets-v7/')?'/'+path:path;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const noCache={cache:'no-store',credentials:'same-origin'};
async function load(){const res=await fetch('/api/admin/products',noCache);if(!res.ok)throw Error(res.status===403?'אין הרשאת מנהל · בדקו את Cloudflare Access':'השרת אינו מוכן ('+res.status+')');products=(await res.json()).products;render();msg('הנתונים נטענו בהצלחה',true)}
function render(){const q=$('search').value.trim().toLowerCase();const rows=products.filter(p=>[p.id,p.name_he,p.category].some(v=>String(v||'').toLowerCase().includes(q)));$('count').textContent=rows.length+' / '+products.length;$('products').innerHTML=rows.map(p=>'<tr><td><img class="thumb" src="'+esc(imageUrl(p.image_key))+'" alt=""></td><td>'+esc(p.name_he)+'</td><td dir="ltr">'+esc(p.id)+'</td><td>'+money(p.price_agorot)+'</td><td>'+p.stock+'</td><td>'+(p.active?'פעיל':'מוסתר')+'</td><td><button data-id="'+esc(p.id)+'">עריכה</button></td></tr>').join('')||'<tr><td colspan="7">אין התאמות</td></tr>'}
$('products').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;editing=products.find(p=>p.id===b.dataset.id);if(!editing)return;const f=$('productForm');$('sku').textContent=editing.id;f.elements.name_he.value=editing.name_he;f.elements.description.value=editing.description;f.elements.price.value=editing.price_agorot==null?'':(editing.price_agorot/100).toFixed(2);f.elements.old_price.value=editing.old_price_agorot==null?'':(editing.old_price_agorot/100).toFixed(2);f.elements.stock.value=editing.stock;f.elements.active.value=editing.active;$('newPhoto').value='';$('editor').showModal()});
function parsePrice(v){if(v==='')return null;const n=Number(v);if(!Number.isFinite(n)||n<0||Math.round(n*100)!==n*100&&Math.abs(Math.round(n*100)-n*100)>1e-6)throw Error('יש להזין מחיר תקין');return Math.round(n*100)}
$('productForm').addEventListener('submit',async e=>{e.preventDefault();if(!editing)return;const f=e.currentTarget;const button=$('save');button.disabled=true;try{const payload={name_he:f.elements.name_he.value,description:f.elements.description.value,price_agorot:parsePrice(f.elements.price.value),old_price_agorot:parsePrice(f.elements.old_price.value),stock:Number(f.elements.stock.value),active:Number(f.elements.active.value)};const file=$('newPhoto').files[0];if(file){if(file.size>5000000)throw Error('התמונה גדולה מ-5MB');const r=await fetch('/api/admin/images',{method:'POST',credentials:'same-origin',headers:{'Content-Type':file.type},body:file});if(!r.ok)throw Error('העלאת התמונה נכשלה');payload.image_key=(await r.json()).image_key}const r=await fetch('/api/admin/products/'+encodeURIComponent(editing.id),{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.error||'שמירה נכשלה');$('editor').close();await load();msg('המוצר נשמר: '+editing.id,true)}catch(e){msg(e.message)}finally{button.disabled=false}});
$('search').addEventListener('input',render);$('reload').onclick=()=>load().catch(e=>msg(e.message));$('cancel').onclick=()=>$('editor').close();load().catch(e=>{$('products').innerHTML='<tr><td colspan="7">הגישה חסומה או שהמסד עדיין לא הוגדר.</td></tr>';msg(e.message)});
</script></body></html>
