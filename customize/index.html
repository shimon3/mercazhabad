<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עיצוב כיסוי אישי — תצוגה מקדימה</title><link rel="stylesheet" href="/customize/studio.css"></head><body>
<header><h1>עיצוב כיסוי אישי <small style="font-size:12px;color:#aaa">תצוגה מקדימה בלבד</small></h1><a style="color:#e4c476" href="/">חזרה לחנות</a></header>
<main><section class="panel"><h2>בחרו כיסוי</h2><label for="brand">מותג</label><select id="brand"><option value="Samsung">Samsung Galaxy</option><option value="iPhone">iPhone</option></select><label for="model">דגם</label><select id="model"></select><label>צבע הכיסוי</label><div class="colors"><button data-color="black" class="selected">שחור</button><button data-color="white">לבן</button><button data-color="clear">שקוף</button></div><h3>מדבקות מהחנות</h3><p class="hint">בחרו מדבקות אמיתיות מקטלוג מרכז חב״ד. אפשר להוסיף כמה מדבקות.</p><div id="assets" aria-live="polite">טוען מדבקות…</div><p id="error" class="notice"></p></section>
<section class="panel"><h2>התוצאה שלכם</h2><div class="stage"><div class="phone" id="phone"><div class="camera"><span></span><span></span><span></span></div></div></div><div class="controls"><label>גודל <input type="range" id="size" min="35" max="160" value="95"></label><label>סיבוב <input type="range" id="angle" min="-180" max="180" value="0"></label></div><div class="actions"><button id="remove">הסר מדבקה נבחרת</button><button id="clear">נקה הכל</button><button id="save">שמור תמונה</button></div><p class="hint">גררו מדבקה באצבע או בעכבר. בחרו מדבקה כדי לשנות גודל וסיבוב. זהו הדמיה בלבד, לא מוצר להזמנה. תמונות המוצרים עשויות להכיל רקע.</p></section></main>
<script defer src="/customize/studio.js"></script></body></html>
