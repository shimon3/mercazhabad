<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עיצוב כיסוי אישי — תצוגה מקדימה</title><style>
:root{font-family:Arial,sans-serif;color:#eee;background:#101010}*{box-sizing:border-box}body{margin:0}header{background:#181818;border-bottom:1px solid #735e29;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0;color:#e4c476}main{max-width:1180px;margin:auto;padding:24px;display:grid;grid-template-columns:350px 1fr;gap:24px}.panel{background:#1d1d1d;border:1px solid #42391f;border-radius:16px;padding:20px}label{display:block;margin:16px 0 6px;color:#e6ce8a}select,button,input{font:inherit}select{width:100%;background:#292929;color:white;border:1px solid #666;padding:12px;border-radius:8px}button{cursor:pointer;background:#352d1c;border:1px solid #9b8041;color:#f4e4ae;padding:10px;border-radius:9px}.colors{display:flex;gap:9px}.colors button{flex:1}.selected{outline:2px solid #e4c476}#assets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:340px;overflow:auto}#assets button{padding:5px;background:#282828;min-height:100px}#assets img{width:100%;height:72px;object-fit:contain}#assets small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage{min-height:520px;display:grid;place-items:center;background:radial-gradient(circle,#343434,#181818);border-radius:15px;overflow:hidden}.phone{width:235px;height:450px;border:6px solid #5a5a5a;border-radius:36px;position:relative;background:#161616;box-shadow:16px 20px 30px #0007;overflow:hidden;touch-action:none}.phone.white{background:#f4f2ed}.phone.clear{background:repeating-linear-gradient(135deg,#ddd8 0 10px,#aaa8 10px 20px)}.camera{position:absolute;top:17px;left:16px;width:80px;height:105px;border-radius:22px;background:#333;border:2px solid #888;z-index:4;display:grid;grid-template-columns:1fr 1fr;padding:9px;gap:5px;pointer-events:none}.camera span{width:25px;height:25px;border-radius:50%;background:#080808;border:5px solid #888}.decal{position:absolute;width:95px;height:95px;object-fit:contain;touch-action:none;cursor:grab;user-select:none;z-index:3}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.hint{font-size:13px;color:#aaa;line-height:1.5}.notice{color:#e6ce8a;font-size:13px}.controls{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin-top:15px}input[type=range]{max-width:120px}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}.stage{min-height:490px}header{padding:14px}h1{font-size:19px}}</style></head><body>
<header><h1>עיצוב כיסוי אישי <small style="font-size:12px;color:#aaa">תצוגה מקדימה בלבד</small></h1><a style="color:#e4c476" href="/">חזרה לחנות</a></header>
<main><section class="panel"><h2>בחרו כיסוי</h2><label for="brand">מותג</label><select id="brand"><option value="Samsung">Samsung Galaxy</option><option value="iPhone">iPhone</option></select><label for="model">דגם</label><select id="model"></select><label>צבע הכיסוי</label><div class="colors"><button data-color="black" class="selected">שחור</button><button data-color="white">לבן</button><button data-color="clear">שקוף</button></div><h3>מדבקות מהחנות</h3><p class="hint">בחרו מדבקות אמיתיות מקטלוג מרכז חב״ד. אפשר להוסיף כמה מדבקות.</p><div id="assets" aria-live="polite">טוען מדבקות…</div><p id="error" class="notice"></p></section>
<section class="panel"><h2>התוצאה שלכם</h2><div class="stage"><div class="phone" id="phone"><div class="camera"><span></span><span></span><span></span></div></div></div><div class="controls"><label>גודל <input type="range" id="size" min="35" max="160" value="95"></label><label>סיבוב <input type="range" id="angle" min="-180" max="180" value="0"></label></div><div class="actions"><button id="remove">הסר מדבקה נבחרת</button><button id="clear">נקה הכל</button><button id="save">שמור תמונה</button></div><p class="hint">גררו מדבקה באצבע או בעכבר. בחרו מדבקה כדי לשנות גודל וסיבוב. זהו הדמיה בלבד, לא מוצר להזמנה. תמונות המוצרים עשויות להכיל רקע.</p></section></main>
<script>
const BASE='https://bdalhyqpruefdbyirykp.supabase.co', KEY='sb_publishable_K6ciGUejNpRfLeIEc598Iw_L3VoMJYM';
const $=id=>document.getElementById(id),phone=$('phone');let active=null,seq=0;
const models={Samsung:['S23','S23+','S23 Ultra','S24','S24+','S24 Ultra','S25','S25+','S25 Ultra','S26','S26+','S26 Ultra'],iPhone:['15','15 Plus','15 Pro','15 Pro Max','16','16 Plus','16 Pro','16 Pro Max','17','17 Pro','17 Pro Max','18']};
function populate(){const m=$('model');m.replaceChildren();models[$('brand').value].forEach(v=>m.add(new Option(($('brand').value==='Samsung'?'Galaxy ':'iPhone ')+v,v)));}populate();$('brand').onchange=populate;
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{phone.className='phone '+(b.dataset.color==='black'?'':b.dataset.color);document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x===b));});
function choose(el){active=el;document.querySelectorAll('.decal').forEach(d=>d.style.outline=d===el?'2px dashed #c7a457':'none');$('size').value=parseInt(el.style.width)||95;$('angle').value=Number(el.dataset.angle)||0;}
function addSticker(p){const img=document.createElement('img');img.className='decal';img.src=p.image_key;img.alt=p.name_he;img.dataset.productId=p.id;img.dataset.angle='0';img.style.width='95px';img.style.height='95px';img.style.left=(65+seq%3*18)+'px';img.style.top=(160+seq%5*25)+'px';seq++;phone.append(img);choose(img);let origin;img.addEventListener('pointerdown',e=>{choose(img);origin={x:e.clientX,y:e.clientY,l:parseFloat(img.style.left),t:parseFloat(img.style.top)};img.setPointerCapture(e.pointerId);e.preventDefault()});img.addEventListener('pointermove',e=>{if(!origin)return;img.style.left=Math.max(0,Math.min(phone.clientWidth-img.offsetWidth,origin.l+e.clientX-origin.x))+'px';img.style.top=Math.max(115,Math.min(phone.clientHeight-img.offsetHeight,origin.t+e.clientY-origin.y))+'px'});img.addEventListener('pointerup',()=>origin=null);img.addEventListener('pointercancel',()=>origin=null);}
$('size').oninput=e=>{if(active){active.style.width=e.target.value+'px';active.style.height=e.target.value+'px'}};$('angle').oninput=e=>{if(active){active.dataset.angle=e.target.value;active.style.transform='rotate('+e.target.value+'deg)'}};$('remove').onclick=()=>{active?.remove();active=null};$('clear').onclick=()=>{phone.querySelectorAll('.decal').forEach(x=>x.remove());active=null};
async function load(){try{const res=await fetch(BASE+'/rest/v1/mercaz_products?select=id,name_he,image_key,category,active&category=eq.PhoneStickers&active=eq.true&order=created_at.asc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!res.ok)throw Error('HTTP '+res.status);const products=await res.json(),host=$('assets');host.replaceChildren();let n=0;for(const p of products){if(!p.image_key)continue;let u;try{u=new URL(p.image_key,location.origin);if(!['https:','http:'].includes(u.protocol)||![location.origin,BASE].includes(u.origin))continue;}catch{continue;}p.image_key=u.href;const b=document.createElement('button'),img=document.createElement('img'),name=document.createElement('small');img.src=u.href;img.loading='lazy';img.alt=p.name_he;name.textContent=p.name_he;b.append(img,name);b.title=p.name_he;b.onclick=()=>addSticker(p);host.append(b);n++;}if(!n)host.textContent='אין מדבקות זמינות';}catch(e){$('assets').textContent='לא ניתן לטעון מדבקות';$('error').textContent='שגיאת טעינת הקטלוג: '+e.message;}}load();
$('save').onclick=async()=>{const c=document.createElement('canvas');c.width=470;c.height=900;const ctx=c.getContext('2d');const bg=getComputedStyle(phone).backgroundColor;ctx.fillStyle=bg==='rgba(0, 0, 0, 0)'?'#ddd':bg;ctx.fillRect(0,0,470,900);ctx.fillStyle='#444';ctx.fillRect(28,30,160,210);for(const d of phone.querySelectorAll('.decal')){try{const image=new Image();image.crossOrigin='anonymous';image.src=d.src;await image.decode();const x=parseFloat(d.style.left)*2,y=parseFloat(d.style.top)*2,w=d.offsetWidth*2;ctx.save();ctx.translate(x+w/2,y+w/2);ctx.rotate(Number(d.dataset.angle||0)*Math.PI/180);ctx.drawImage(image,-w/2,-w/2,w,w);ctx.restore()}catch(e){$('error').textContent='לא ניתן לייצא תמונה זו בגלל הגבלות גישה לתמונות המקור.';return}}try{const a=document.createElement('a');a.download='mercaz-case-preview.png';a.href=c.toDataURL('image/png');a.click()}catch(e){$('error').textContent='שמירת התמונה נכשלה';}};
</script></body></html>
